name: celechron
description: Aelechron / Helechron - Time scheduler for zjuers.
publish_to: "none"
version: 0.1.7-dev.6+93
environment:
  sdk: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get:
  cupertino_icons:
  table_calendar:
  hive:
  hive_flutter:
  uuid:
  flutter_svg:
  intl:
  extended_sliver:
  quiver: ^3.2.1
  qr_flutter:
  crypto:
  timezone:
  path_provider:
  share_plus:
  url_launcher:
  app_links: ^6.4.0
  # Android / iOS native plugins (HarmonyOS uses ArkTS channel, see lib/services/mobile_native_service.dart)
  file_picker:
  device_calendar: ^4.3.3
  flutter_local_notifications:
  workmanager:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons:

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  image_path: assets/logo.png
  android: true
  ios: true
  remove_alpha_ios: true
