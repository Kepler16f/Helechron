name: Build HarmonyOS HAP

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
      FLUTTER_OHOS_REF: 3.27.5-ohos-1.0.8
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup HarmonyOS SDK and command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Verify HarmonyOS tools
        run: |
          hvigorw -v || true
          ohpm -v || true

      - name: Clone Flutter-ohos SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos"
          git clone --branch "$FLUTTER_OHOS_REF" --depth 1 "$FLUTTER_OHOS_REPO" "$FLUTTER_OHOS_DIR"
          cd "$FLUTTER_OHOS_DIR"
          git fetch --tags --force || true
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"
          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
        timeout-minutes: 20

      - name: Configure npm registry
        run: |
          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc

      - name: Verify Flutter-ohos
        run: |
          flutter --version
          dart --version
          flutter doctor -v || true

      - name: Get Flutter dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then
              echo "flutter pub get succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::flutter pub get failed on attempt $attempt (gitee may be rate-limiting), retrying in 20s..."
            sleep 20
          done
          echo "::error::flutter pub get failed after 5 attempts"
          exit 1

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep "displayVersion =>" lib/worker/fuse.dart | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build HAP
        run: |
          set +e
          flutter build hap --release --target-platform ohos-arm64
          FLUTTER_BUILD_STATUS=$?
          set -e

          HAP="$(find ohos/entry/build -type f -name '*unsigned*.hap' 2>/dev/null | head -n 1)"
          if [ -z "$HAP" ]; then
            echo "::error::No HAP file produced."
            find ohos -type f -name '*.hap' -print || true
            exit 1
          fi

          if [ "$FLUTTER_BUILD_STATUS" -ne 0 ]; then
            echo "::notice title=Unsigned HAP recovered::flutter exited with $FLUTTER_BUILD_STATUS (missing signing config); uploading the unsigned HAP produced by hvigor."
          fi

          VERSION="${{ steps.get_version.outputs.version }}"
          HAP_NAME="Helechron_${VERSION}_unsigned"

          mkdir -p build/ohos
          cp -r "$(dirname "$HAP")" "build/ohos/$HAP_NAME"
          ls -lh build/ohos
        timeout-minutes: 40

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: Helechron_${{ steps.get_version.outputs.version }}_unsigned.hap
          path: build/ohos/Helechron_*_unsigned
          archive: false
          retention-days: 30
          if-no-files-found: error
