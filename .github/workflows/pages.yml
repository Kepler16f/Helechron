name: Deploy legal pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/legal/**"
      - "tool/store/build_legal_html.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy privacy policy & terms
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild legal HTML from text sources
        run: python tool/store/build_legal_html.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/index.html docs/privacy.html docs/terms.html docs/icon.png docs/.nojekyll _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
