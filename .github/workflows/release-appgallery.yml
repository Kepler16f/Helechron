name: Release to AppGallery

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "打包平台"
        required: true
        # 0.1.7beta1 为"仅鸿蒙"beta：本次发版默认只构建 harmonyos，跳过 Android APK。
        # Android job 与其 if 条件原样保留，恢复双平台时把 default 改回 both 即可。
        default: harmonyos
        type: choice
        options:
          - both
          - android
          - harmonyos
      release_tag:
        description: "GitHub Release tag（留空则不发布 Release，仅保留 Artifacts）"
        required: false
        default: "v0.1.7-beta1"
        type: string

jobs:
  android:
    name: Android signed APK
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    env:
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      USER_AGREEMENT_URL: ${{ vars.USER_AGREEMENT_URL }}
      ICP_FILING_NUMBER: ${{ vars.ICP_FILING_NUMBER }}
      DEVELOPER_NAME: ${{ vars.DEVELOPER_NAME }}
      DEVELOPER_SUBJECT_TYPE: ${{ vars.DEVELOPER_SUBJECT_TYPE }}
      CALENDAR_CONFIG_URL: ${{ vars.CALENDAR_CONFIG_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=app/release.keystore"
          } > android/key.properties

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep "displayVersion =>" lib/worker/fuse.dart | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build signed APK
        run: |
          set -euo pipefail
          DEFINES=""
          if [ -n "${PRIVACY_POLICY_URL:-}" ]; then
            DEFINES="$DEFINES --dart-define=PRIVACY_POLICY_URL=${PRIVACY_POLICY_URL}"
          fi
          if [ -n "${USER_AGREEMENT_URL:-}" ]; then
            DEFINES="$DEFINES --dart-define=USER_AGREEMENT_URL=${USER_AGREEMENT_URL}"
          fi
          if [ -n "${ICP_FILING_NUMBER:-}" ]; then
            DEFINES="$DEFINES --dart-define=ICP_FILING_NUMBER=${ICP_FILING_NUMBER}"
          fi
          if [ -n "${DEVELOPER_NAME:-}" ]; then
            DEFINES="$DEFINES --dart-define=DEVELOPER_NAME=${DEVELOPER_NAME}"
          fi
          if [ -n "${DEVELOPER_SUBJECT_TYPE:-}" ]; then
            DEFINES="$DEFINES --dart-define=DEVELOPER_SUBJECT_TYPE=${DEVELOPER_SUBJECT_TYPE}"
          fi
          if [ -n "${CALENDAR_CONFIG_URL:-}" ]; then
            DEFINES="$DEFINES --dart-define=CALENDAR_CONFIG_URL=${CALENDAR_CONFIG_URL}"
          fi
          flutter build apk --release --target-platform android-arm64 $DEFINES

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Package artifact
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/dist/Helechron_${{ steps.get_version.outputs.version }}_android_signed.apk"
          ls -lh build/dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Helechron_${{ steps.get_version.outputs.version }}_android_signed.apk
          path: build/dist/*.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

  harmonyos:
    name: HarmonyOS signed HAP/APP
    if: ${{ inputs.platforms == 'both' || inputs.platforms == 'harmonyos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布 beta GitHub Release（上传 .hap 附件）需要写权限
    env:
      FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
      FLUTTER_OHOS_REF: 3.27.5-ohos-1.0.8
      # 镜像 pub.flutter-io.cn 对 extended_sliver-2.1.3 返回损坏归档（content-hash 不符，
      # 5 次重试全挂），临时切回官方源；runner 为境外 GitHub 托管机，直连无障碍
      # （同仓库 Android job 不设此变量即走 pub.dev，一直正常）。镜像修复后可改回。
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      USER_AGREEMENT_URL: ${{ vars.USER_AGREEMENT_URL }}
      ICP_FILING_NUMBER: ${{ vars.ICP_FILING_NUMBER }}
      DEVELOPER_NAME: ${{ vars.DEVELOPER_NAME }}
      DEVELOPER_SUBJECT_TYPE: ${{ vars.DEVELOPER_SUBJECT_TYPE }}
      CALENDAR_CONFIG_URL: ${{ vars.CALENDAR_CONFIG_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup HarmonyOS SDK and command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Verify HarmonyOS tools
        run: |
          hvigorw -v || true
          ohpm -v || true

      - name: Clone Flutter-ohos SDK
        run: |
          FLUTTER_OHOS_DIR="$RUNNER_TEMP/flutter_ohos"
          git clone --branch "$FLUTTER_OHOS_REF" --depth 1 "$FLUTTER_OHOS_REPO" "$FLUTTER_OHOS_DIR"
          cd "$FLUTTER_OHOS_DIR"
          git fetch --tags --force || true
          git config --global --add safe.directory "$FLUTTER_OHOS_DIR"
          echo "$FLUTTER_OHOS_DIR/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$FLUTTER_OHOS_DIR" >> "$GITHUB_ENV"
        timeout-minutes: 20

      - name: Configure npm registry
        run: |
          echo "registry=https://repo.huaweicloud.com/repository/npm/" > ~/.npmrc
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> ~/.npmrc

      - name: Locate icon processing in the Flutter-ohos SDK
        run: |
          SDK="$RUNNER_TEMP/flutter_ohos"
          echo "::group::搜索 SDK 中与 app_icon / 图标缩放相关的处理逻辑"
          grep -rn "app_icon" "$SDK/packages" 2>/dev/null | grep -v "test" | head -40 || true
          echo "--- 512 / resize 相关 ---"
          grep -rn "appIcon\|app_icon" "$SDK/packages/flutter_tools/lib/src/ohos" 2>/dev/null | head -30 || true
          echo "::endgroup::"

      - name: Verify Flutter-ohos
        run: |
          flutter --version
          dart --version
          flutter doctor -v || true

      - name: Restore HarmonyOS signing material
        env:
          OHOS_STORE_FILE_BASE64: ${{ secrets.OHOS_STORE_FILE_BASE64 }}
          OHOS_STORE_FILE_PASSWORD: ${{ secrets.OHOS_STORE_FILE_PASSWORD }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_CERT_BASE64: ${{ secrets.OHOS_CERT_BASE64 }}
          OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
          OHOS_MATERIAL_ONLY: "1"
        run: python3 tool/ohos/apply_signing.py

      - name: Switch to HarmonyOS dependency set
        run: |
          cp tool/pubspec_ohos.yaml pubspec.yaml
          rm -f pubspec.lock
          cp tool/ohos_stubs/mobile_native_service.dart lib/services/mobile_native_service.dart
          cp tool/ohos_stubs/mobile_background.dart lib/worker/mobile_background.dart

      - name: Get Flutter dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then
              echo "flutter pub get succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::flutter pub get failed on attempt $attempt (gitee may be rate-limiting), retrying in 20s..."
            sleep 20
          done
          echo "::error::flutter pub get failed after 5 attempts"
          exit 1

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep "displayVersion =>" lib/worker/fuse.dart | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned HAP
        run: |
          set +e
          DEFINES=""
          if [ -n "${PRIVACY_POLICY_URL:-}" ]; then
            DEFINES="$DEFINES --dart-define=PRIVACY_POLICY_URL=${PRIVACY_POLICY_URL}"
          fi
          if [ -n "${USER_AGREEMENT_URL:-}" ]; then
            DEFINES="$DEFINES --dart-define=USER_AGREEMENT_URL=${USER_AGREEMENT_URL}"
          fi
          if [ -n "${ICP_FILING_NUMBER:-}" ]; then
            DEFINES="$DEFINES --dart-define=ICP_FILING_NUMBER=${ICP_FILING_NUMBER}"
          fi
          if [ -n "${DEVELOPER_NAME:-}" ]; then
            DEFINES="$DEFINES --dart-define=DEVELOPER_NAME=${DEVELOPER_NAME}"
          fi
          if [ -n "${DEVELOPER_SUBJECT_TYPE:-}" ]; then
            DEFINES="$DEFINES --dart-define=DEVELOPER_SUBJECT_TYPE=${DEVELOPER_SUBJECT_TYPE}"
          fi
          if [ -n "${CALENDAR_CONFIG_URL:-}" ]; then
            DEFINES="$DEFINES --dart-define=CALENDAR_CONFIG_URL=${CALENDAR_CONFIG_URL}"
          fi
          flutter build hap --release --target-platform ohos-arm64 $DEFINES
          FLUTTER_BUILD_STATUS=$?
          set -e
          HAP=$(find ohos -type f -name '*unsigned*.hap' | head -n 1 || true)
          if [ -z "$HAP" ]; then
            echo "::error::flutter build hap failed (exit $FLUTTER_BUILD_STATUS) and no unsigned HAP was produced"
            exit 1
          fi
          if [ "$FLUTTER_BUILD_STATUS" -ne 0 ]; then
            echo "::notice::flutter exited with $FLUTTER_BUILD_STATUS (expected without signing config); using unsigned HAP: $HAP"
          fi
        timeout-minutes: 40

      - name: Assemble unsigned APP
        working-directory: ohos
        run: |
          set +e
          hvigorw --mode project -p product=default -p buildMode=release assembleApp --no-daemon
          echo "assembleApp exit: $?"
          set -e
          find . -type f \( -name 'pack.info' -o -name '*.app' \) -print || true

      - name: Locate HarmonyOS signing tools
        run: |
          set -euo pipefail
          SIGN_TOOL=$(find "$HOS_SDK_HOME" -maxdepth 8 -type f -name 'hap-sign-tool.jar' | head -n 1 || true)
          PACK_TOOL=$(find "$HOS_SDK_HOME" -maxdepth 8 -type f -name 'app_packing_tool.jar' | head -n 1 || true)
          echo "SIGN_TOOL=$SIGN_TOOL"
          echo "PACK_TOOL=$PACK_TOOL"
          if [ -z "$SIGN_TOOL" ] || [ -z "$PACK_TOOL" ]; then
            echo "::error::未找到 hap-sign-tool.jar 或 app_packing_tool.jar"
            find "$HOS_SDK_HOME" -maxdepth 8 -type f -name '*.jar' | head -n 50 || true
            exit 1
          fi
          echo "SIGN_TOOL=$SIGN_TOOL" >> "$GITHUB_ENV"
          echo "PACK_TOOL=$PACK_TOOL" >> "$GITHUB_ENV"

      - name: Sign HAP and pack APP
        env:
          OHOS_STORE_FILE_PASSWORD: ${{ secrets.OHOS_STORE_FILE_PASSWORD }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p build/dist
          HAP=$(find ohos -type f -name '*unsigned*.hap' | head -n 1 || true)
          if [ -z "$HAP" ]; then
            HAP=$(find ohos -type f -name '*.hap' | head -n 1 || true)
          fi
          if [ -z "$HAP" ]; then
            echo "::error::未找到未签名 HAP"
            exit 1
          fi
          # app 模式必需 pack.info：优先用上方 assembleApp 生成的，找不到则从 HAP 包内提取（hvigor 构建时会内嵌 pack.info 到 HAP 根目录）
          PACK_INFO=$(find ohos -type f -name 'pack.info' | head -n 1 || true)
          if [ -z "$PACK_INFO" ]; then
            unzip -p "$HAP" pack.info > build/dist/pack.info || true
            PACK_INFO=build/dist/pack.info
          fi
          if [ ! -s "$PACK_INFO" ]; then
            echo "::error::未找到可用的 pack.info，HAP 包内容如下："
            unzip -l "$HAP" | head -n 30
            exit 1
          fi
          echo "Using pack.info: $PACK_INFO"
          echo "Signing HAP: $HAP"
          java -jar "$SIGN_TOOL" sign-app \
            -mode localSign \
            -keyAlias "$OHOS_KEY_ALIAS" \
            -keyPwd "$OHOS_KEY_PASSWORD" \
            -appCertFile ohos/signature/release.cer \
            -profileFile ohos/signature/release.p7b \
            -inFile "$HAP" \
            -signAlg SHA256withECDSA \
            -keystoreFile ohos/signature/release.p12 \
            -keystorePwd "$OHOS_STORE_FILE_PASSWORD" \
            -outFile "build/dist/Helechron_${VERSION}_ohos_signed.hap" \
            -compatibleVersion 12
          # AppGallery 的 .app 容器使用标准 HAP 文件名，并让 pack.info 与实际 HAP 对应
          cp "build/dist/Helechron_${VERSION}_ohos_signed.hap" "build/dist/entry-default.hap"
          python3 - "$PACK_INFO" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path, encoding='utf-8'))
          data['hapList'] = ['entry-default.hap']
          json.dump(data, open(path, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          # App 打包指令的输入参数是 --hap-path（官方文档表5），--hap-list 不会被识别
          java -jar "$PACK_TOOL" --mode app \
            --pack-info-path "$PACK_INFO" \
            --hap-path "build/dist/entry-default.hap" \
            --out-path "build/dist/Helechron_${VERSION}_ohos_unsigned.app" \
            --replace-pack-info false --force true
          # .app 外层同样需要签名；-inForm zip 才能按 App Pack 容器签名
          java -jar "$SIGN_TOOL" sign-app \
            -mode localSign \
            -keyAlias "$OHOS_KEY_ALIAS" \
            -keyPwd "$OHOS_KEY_PASSWORD" \
            -appCertFile ohos/signature/release.cer \
            -profileFile ohos/signature/release.p7b \
            -inFile "build/dist/Helechron_${VERSION}_ohos_unsigned.app" \
            -inForm zip \
            -signAlg SHA256withECDSA \
            -keystoreFile ohos/signature/release.p12 \
            -keystorePwd "$OHOS_STORE_FILE_PASSWORD" \
            -outFile "build/dist/Helechron_${VERSION}_ohos_signed.app"
          ls -lh build/dist

      - name: Verify packaged icon sizes
        run: |
          set -euo pipefail
          rm -rf build/icon-check
          mkdir -p build/icon-check
          unzip -o -q build/dist/entry-default.hap -d build/icon-check || true
          cat > build/png_size.py <<'PY'
          import struct, sys
          for path in sys.argv[1:]:
              with open(path, 'rb') as fh:
                  data = fh.read(33)
          w, h = struct.unpack('>II', data[16:24])
          print(f"{w}x{h}")
          PY
          echo "::group::包内图标尺寸（鸿蒙单层图标要求 1024x1024）"
          found_bad=0
          find build/icon-check -path "*resources/base/media*" -name "*.png" | sort | while IFS= read -r f; do
            size=$(python3 build/png_size.py "$f")
            echo "$size  ${f#build/icon-check/}"
            if [ "$size" != "1024x1024" ]; then
              echo "::warning::包内图标尺寸不合规: $size ${f#build/icon-check/}（标准要求 1024x1024）"
              found_bad=1
            fi
          done
          echo "::endgroup::"

      - name: Collect packages
        run: |
          set -euo pipefail
          VERSION="${{ steps.get_version.outputs.version }}"
          test -s "build/dist/Helechron_${VERSION}_ohos_signed.hap"
          test -s "build/dist/Helechron_${VERSION}_ohos_signed.app"
          ls -lh build/dist

      # archive:false 仅支持单文件，.hap 与 .app 分别上传
      - name: Upload signed HAP
        uses: actions/upload-artifact@v7
        with:
          name: Helechron_${{ steps.get_version.outputs.version }}_ohos_signed.hap
          path: build/dist/Helechron_${{ steps.get_version.outputs.version }}_ohos_signed.hap
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed APP
        uses: actions/upload-artifact@v7
        with:
          name: Helechron_${{ steps.get_version.outputs.version }}_ohos_signed.app
          path: build/dist/Helechron_${{ steps.get_version.outputs.version }}_ohos_signed.app
          archive: false
          retention-days: 30
          if-no-files-found: error

      # 本次 beta：把未签名 .hap 作为 GitHub Release 附件上传（tag 惯例沿用仓库 v 前缀，
      # 如 v0.1.6；beta 版建议 v0.1.7-beta1）。仓库是公开的，Release 公开版本只放
      # unsigned 包，签名包（AGC 上架用的 .app）仅走 Artifacts 30 天私有通道。
      # 标记 --prerelease：
      #   1) 应用内更新检查走 /releases/latest，官方语义会忽略 prerelease，beta 不会误推给正式版用户；
      #   2) 即便被读到，tag 正则也不匹配 "-beta1"，同样不会触发提示。
      # release_tag 输入留空则跳过本步骤，仅保留 Artifacts（恢复正式版发布方式）。
      - name: Publish beta GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          SRC=$(find ohos -type f -name '*unsigned*.hap' | head -n 1 || true)
          if [ -z "$SRC" ]; then
            echo "::error::未找到未签名 HAP，无法发布"
            exit 1
          fi
          HAP="build/dist/Helechron_${VERSION}_ohos_unsigned.hap"
          cp "$SRC" "$HAP"
          test -s "$HAP"
          # 幂等：beta 反复出包时先删除同名 Release（含其 tag 与旧 signed 资产）再重建
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" "$HAP" \
            --prerelease \
            --title "Helechron ${VERSION}（仅鸿蒙 beta，未签名）" \
            --notes "Helechron ${VERSION} 鸿蒙 beta 包（本次不发布 Android 产物）。

          - 附件 \`Helechron_${VERSION}_ohos_unsigned.hap\` 为未签名包：不能直接在真机安装，
            需用 DevEco Studio 调试签名自行重签后再装，仅供代码/资源审阅与自行构建参考。
          - 签名产物（含 AGC 上架用的 \`.app\`）不公开分发，见本次 run 的 Artifacts：
            \`Helechron_${VERSION}_ohos_signed.app\` / \`Helechron_${VERSION}_ohos_signed.hap\`。
          - 真实包版本仍为 0.1.7 (versionCode 100)，与 AGC 审核中的版本一致；\`${VERSION}\` 仅为应用内展示文本。"

      # ————— 本地拉取产物惯例（GitHub runner 无法写入本机，CI 成功后在本地 Git Bash 执行）—————
      # 产物均为 archive:false 单文件，直存无需解压（$VERSION 形如 0.1.7beta1，$RUN_ID 为本次 run ID）：
      #   # .hap（未签名，公开审阅用；真机安装需自行重签调试证书）：
      #   gh release download v0.1.7-beta1 -D "$USERPROFILE/Downloads"
      #   # .app（AGC 手动上架用，从 Artifacts 直存 zip）：
      #   ART_ID=$(gh api "repos/Kepler16f/Helechron/actions/runs/$RUN_ID/artifacts" \
      #     --jq ".artifacts[] | select(.name | endswith(\"_ohos_signed.app\")) | .id")
      #   gh api "repos/Kepler16f/Helechron/actions/artifacts/$ART_ID/zip" \
      #     > "$USERPROFILE/Downloads/Helechron_${VERSION}_ohos_signed.app"
      #   # .app 是 zip 容器，落盘后缀用 .app 即可，AGC 网页端直接上传该文件。
